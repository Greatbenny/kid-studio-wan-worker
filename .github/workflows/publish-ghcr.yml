name: Build and publish RunPod profile images

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - requirements.txt
      - handler.py
      - storymind_worker.py
      - wan_engine.py
      - performance_engine.py
      - .github/workflows/publish-ghcr.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: video
            image: kid-studio-wan-video-worker
          - profile: comfyui
            image: kid-studio-wan-comfyui-worker
          - profile: enhancement
            image: kid-studio-wan-enhancement-worker
          - profile: avatar
            image: kid-studio-wan-avatar-worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.profile }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: final
          build-args: |
            WORKER_PROFILE=${{ matrix.profile }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.profile }}
